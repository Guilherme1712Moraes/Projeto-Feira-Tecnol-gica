<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRotas — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-900:#0f3d2e;
    --verde-700:#1f6b48;
    --verde-500:#3f9d68;
    --verde-200:#c9e8d4;
    --laranja-700:#c2490c;
    --laranja-500:#ff6b1a;
    --laranja-300:#ffb27a;
    --papel:#faf5ec;
    --papel-2:#f1e8d8;
    --tinta:#17241d;
    --tinta-suave:#4a5a4f;
    --branco:#fffdf9;
    --erro:#b3261e;
    --erro-bg:#fbeae8;
    --raio:18px;
    --raio-sm:10px;
    --sombra: 0 10px 30px -12px rgba(15,61,46,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Manrope',sans-serif;
    background:var(--papel);
    color:var(--tinta);
    line-height:1.55;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* fundo decorativo com "trilha" de coleta, ecoando a identidade do site */
  .bg-trilha{
    position:fixed;inset:0;
    background:
      radial-gradient(600px 320px at 12% -8%, rgba(63,157,104,0.14), transparent 60%),
      radial-gradient(560px 300px at 108% 6%, rgba(255,107,26,0.12), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative;
    z-index:1;
    padding:22px 24px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--verde-900);
    width:fit-content;
  }
  .logo-mark{
    width:30px;height:30px;
    border-radius:50%;
    background:conic-gradient(from 220deg, var(--verde-500), var(--laranja-500), var(--verde-700));
    flex-shrink:0;
  }

  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .auth-card{
    width:100%;
    max-width:408px;
    background:var(--branco);
    border-radius:var(--raio);
    box-shadow:var(--sombra);
    border:1px solid rgba(15,61,46,0.08);
    padding:36px 32px 32px;
  }

  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:0.7rem;
    font-weight:800;
    color:var(--laranja-700);
    display:block;
    margin-bottom:8px;
  }
  .auth-card h1{
    font-size:1.7rem;
    color:var(--verde-900);
  }
  .auth-sub{
    color:var(--tinta-suave);
    font-size:0.92rem;
    margin-top:8px;
  }

  .tabs{
    display:flex;
    background:var(--papel-2);
    border-radius:100px;
    padding:4px;
    margin:24px 0 22px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:100px;
    font-weight:700;
    font-size:0.85rem;
    color:var(--tinta-suave);
    transition:.2s;
  }
  .tab-btn.active{
    background:var(--verde-900);
    color:var(--branco);
  }

  form{display:none;flex-direction:column;gap:16px;}
  form.active{display:flex;}

  .field label{
    display:block;
    font-size:0.82rem;
    font-weight:700;
    color:var(--verde-900);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:var(--raio-sm);
    border:1.5px solid rgba(15,61,46,0.16);
    background:var(--papel);
    font-family:inherit;
    font-size:0.95rem;
    color:var(--tinta);
    transition:.15s;
  }
  .field input:focus{
    outline:none;
    border-color:var(--verde-500);
    background:var(--branco);
    box-shadow:0 0 0 3px rgba(63,157,104,0.15);
  }
  .field input.invalid{
    border-color:var(--erro);
  }
  .field-error{
    font-size:0.78rem;
    color:var(--erro);
    margin-top:5px;
    min-height:0;
    display:none;
  }
  .field-error.show{display:block;}

  .pass-row{position:relative;}
  .toggle-pass{
    position:absolute;
    right:10px;top:50%;
    transform:translateY(3px);
    background:none;border:none;
    font-size:0.75rem;
    font-weight:700;
    color:var(--verde-700);
    padding:4px 6px;
  }

  .submit-btn{
    margin-top:6px;
    background:var(--laranja-500);
    color:var(--branco);
    border:none;
    padding:13px 20px;
    border-radius:100px;
    font-weight:800;
    font-size:0.95rem;
    box-shadow:0 10px 24px -8px rgba(255,107,26,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .submit-btn:hover{transform:translateY(-1px);}
  .submit-btn:disabled{opacity:.65;cursor:not-allowed;transform:none;}

  .spinner{
    width:15px;height:15px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    animation:spin .7s linear infinite;
    display:none;
  }
  .submit-btn.loading .spinner{display:inline-block;}
  .submit-btn.loading .btn-label{opacity:.85;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .banner{
    display:none;
    align-items:flex-start;
    gap:8px;
    font-size:0.85rem;
    padding:11px 13px;
    border-radius:var(--raio-sm);
    margin-bottom:16px;
  }
  .banner.show{display:flex;}
  .banner.erro{background:var(--erro-bg);color:var(--erro);}
  .banner.ok{background:var(--verde-200);color:var(--verde-900);}

  .hint{
    font-size:0.78rem;
    color:var(--tinta-suave);
    margin-top:2px;
  }

  .strength{
    display:flex;
    gap:4px;
    margin-top:7px;
  }
  .strength i{
    height:4px;flex:1;
    border-radius:3px;
    background:rgba(15,61,46,0.12);
    transition:.2s;
  }

  /* ---- estado logado ---- */
  .welcome{
    display:none;
    text-align:center;
  }
  .welcome.active{display:block;}
  .avatar{
    width:56px;height:56px;
    margin:0 auto 16px;
    border-radius:50%;
    background:conic-gradient(from 220deg, var(--verde-500), var(--laranja-500), var(--verde-700));
    display:flex;align-items:center;justify-content:center;
    color:var(--branco);
    font-weight:800;
    font-size:1.2rem;
    font-family:'Fraunces',serif;
  }
  .welcome h1{font-size:1.5rem;color:var(--verde-900);}
  .welcome p{color:var(--tinta-suave);font-size:0.92rem;margin-top:8px;}
  .logout-btn{
    margin-top:24px;
    background:transparent;
    border:2px solid var(--verde-900);
    color:var(--verde-900);
    padding:11px 22px;
    border-radius:100px;
    font-weight:700;
    font-size:0.9rem;
  }

  footer{
    position:relative;z-index:1;
    text-align:center;
    padding:18px;
    font-size:0.78rem;
    color:var(--tinta-suave);
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;}
  }
</style>
</head>
<body>

<div class="bg-trilha"></div>

<header>
  <a href="#" class="logo"><span class="logo-mark"></span> EcoRotas</a>
</header>

<main>
  <div class="auth-card">

    <!-- FORMULÁRIOS -->
    <div id="authView">
      <span class="eyebrow">Área da comunidade</span>
      <h1 id="authTitle">Bem-vindo de volta</h1>
      <p class="auth-sub" id="authSub">Entre para acompanhar rotas e cadastrar pontos de coleta.</p>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Entrar</button>
        <button class="tab-btn" id="tabRegister" type="button">Criar conta</button>
      </div>

      <div class="banner erro" id="loginBanner"></div>
      <form id="loginForm" class="active" novalidate>
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" autocomplete="email" placeholder="voce@exemplo.com">
          <div class="field-error" id="loginEmailErr"></div>
        </div>
        <div class="field">
          <label for="loginPass">Senha</label>
          <div class="pass-row">
            <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="toggle-pass" data-target="loginPass">mostrar</button>
          </div>
          <div class="field-error" id="loginPassErr"></div>
        </div>
        <button type="submit" class="submit-btn" id="loginSubmit">
          <span class="spinner"></span>
          <span class="btn-label">Entrar</span>
        </button>
        <p class="hint" style="text-align:center;">Ainda não tem conta? <a href="#" id="goRegister" style="color:var(--verde-700);font-weight:700;">Cadastre-se</a></p>
      </form>

      <div class="banner erro" id="regBanner"></div>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" autocomplete="email" placeholder="voce@exemplo.com">
          <div class="field-error" id="regEmailErr"></div>
        </div>
        <div class="field">
          <label for="regPass">Senha</label>
          <div class="pass-row">
            <input type="password" id="regPass" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
            <button type="button" class="toggle-pass" data-target="regPass">mostrar</button>
          </div>
          <div class="strength" id="strengthBars">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="field-error" id="regPassErr"></div>
        </div>
        <div class="field">
          <label for="regPass2">Confirmar senha</label>
          <input type="password" id="regPass2" autocomplete="new-password" placeholder="Repita a senha">
          <div class="field-error" id="regPass2Err"></div>
        </div>
        <button type="submit" class="submit-btn" id="regSubmit">
          <span class="spinner"></span>
          <span class="btn-label">Criar conta</span>
        </button>
        <p class="hint" style="text-align:center;">Já tem conta? <a href="#" id="goLogin" style="color:var(--verde-700);font-weight:700;">Entrar</a></p>
      </form>
    </div>

    <!-- LOGADO -->
    <div class="welcome" id="welcomeView">
      <div class="avatar" id="avatarInitial">?</div>
      <h1>Você entrou!</h1>
      <p id="welcomeEmail"></p>
      <p class="hint" id="welcomeSince"></p>
      <button class="logout-btn" id="logoutBtn">Sair da conta</button>
    </div>

  </div>
</main>

<footer>EcoRotas · cadastro protegido por hash de senha, dados guardados de forma persistente</footer>

<script>
(function(){
  const API_URL = 'http://localhost:3000/api';
  let currentSession = null;
  const $ = id => document.getElementById(id);
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Funções de UI
  function showBanner(el, msg, type){
    el.textContent = msg;
    el.className = 'banner show ' + type;
  }
  function hideBanner(el){ el.className = 'banner'; }
  function setFieldError(inputEl, errEl, msg){
    if(msg){
      inputEl.classList.add('invalid');
      errEl.textContent = msg;
      errEl.classList.add('show');
    } else {
      inputEl.classList.remove('invalid');
      errEl.classList.remove('show');
      errEl.textContent = '';
    }
  }
  function setLoading(btn, isLoading){
    btn.disabled = isLoading;
    btn.classList.toggle('loading', isLoading);
  }

  // Alternância de abas
  const tabLogin = $('tabLogin'), tabRegister = $('tabRegister');
  const loginForm = $('loginForm'), registerForm = $('registerForm');
  const authTitle = $('authTitle'), authSub = $('authSub');

  function showLoginTab(){
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.classList.add('active'); registerForm.classList.remove('active');
    authTitle.textContent = 'Bem-vindo de volta';
    authSub.textContent = 'Entre para acompanhar rotas e cadastrar pontos de coleta.';
    hideBanner($('regBanner'));
  }
  function showRegisterTab(){
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.classList.add('active'); loginForm.classList.remove('active');
    authTitle.textContent = 'Crie sua conta';
    authSub.textContent = 'Leva menos de um minuto para começar a colaborar.';
    hideBanner($('loginBanner'));
  }
  
  tabLogin.addEventListener('click', showLoginTab);
  tabRegister.addEventListener('click', showRegisterTab);
  $('goRegister').addEventListener('click', e => { e.preventDefault(); showRegisterTab(); });
  $('goLogin').addEventListener('click', e => { e.preventDefault(); showLoginTab(); });

  // Mostrar/ocultar senha
  document.querySelectorAll('.toggle-pass').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = $(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'ocultar' : 'mostrar';
    });
  });

  // Força de senha
  const regPass = $('regPass');
  const strengthBars = $('strengthBars').children;
  regPass.addEventListener('input', () => {
    const v = regPass.value;
    let score = 0;
    if(v.length >= 8) score++;
    if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if(/\d/.test(v)) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;
    const colors = ['#e0564a','#ff9d4a','#e0c23f','#3f9d68'];
    for(let i=0;i<4;i++){
      strengthBars[i].style.background = i < score ? colors[score-1] : 'rgba(15,61,46,0.12)';
    }
  });

  // Requerimento de Cadastro na API
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideBanner($('regBanner'));
    const emailEl = $('regEmail'), passEl = $('regPass'), pass2El = $('regPass2');
    const email = emailEl.value.trim(), pass = passEl.value, pass2 = pass2El.value;

    setFieldError(emailEl, $('regEmailErr'), ''); setFieldError(passEl, $('regPassErr'), ''); setFieldError(pass2El, $('regPass2Err'), '');

    let hasError = false;
    if(!emailRe.test(email)){ setFieldError(emailEl, $('regEmailErr'), 'Digite um e-mail válido.'); hasError = true; }
    if(pass.length < 8){ setFieldError(passEl, $('regPassErr'), 'Use ao menos 8 caracteres.'); hasError = true; }
    if(pass2 !== pass){ setFieldError(pass2El, $('regPass2Err'), 'As senhas não coincidem.'); hasError = true; }
    if(hasError) return;

    const btn = $('regSubmit'); setLoading(btn, true);
    
    try {
      const response = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await response.json();
      
      if (!response.ok) throw new Error(data.error);
      
      showBanner($('regBanner'), 'Conta criada! Faça login.', 'ok');
      setTimeout(showLoginTab, 2000);
    } catch(err) {
      showBanner($('regBanner'), err.message || 'Erro ao criar conta.', 'erro');
    } finally {
      setLoading(btn, false);
    }
  });

  // Requerimento de Login na API
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideBanner($('loginBanner'));
    const emailEl = $('loginEmail'), passEl = $('loginPass');
    const email = emailEl.value.trim(), pass = passEl.value;

    setFieldError(emailEl, $('loginEmailErr'), ''); setFieldError(passEl, $('loginPassErr'), '');

    let hasError = false;
    if(!emailRe.test(email)){ setFieldError(emailEl, $('loginEmailErr'), 'Digite um e-mail válido.'); hasError = true; }
    if(!pass){ setFieldError(passEl, $('loginPassErr'), 'Digite sua senha.'); hasError = true; }
    if(hasError) return;

    const btn = $('loginSubmit'); setLoading(btn, true);

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await response.json();
      
      if (!response.ok) throw new Error(data.error);
      localStorage.setItem('ecorotasUser', JSON.stringify(data.user));
      window.location.href = 'index.html';
    } catch(err) {
      showBanner($('loginBanner'), err.message || 'Erro ao conectar.', 'erro');
    } finally {
      setLoading(btn, false);
    }
  });

  // Sessão
  function enterSession(user){
    currentSession = user;
    $('authView').style.display = 'none';
    $('welcomeView').classList.add('active');
    $('avatarInitial').textContent = user.email[0].toUpperCase();
    $('welcomeEmail').textContent = user.email;
    const d = new Date(user.createdAt);
    $('welcomeSince').textContent = 'Conta criada em ' + d.toLocaleDateString('pt-BR');
  }
  $('logoutBtn').addEventListener('click', () => {
    currentSession = null;
    $('welcomeView').classList.remove('active');
    $('authView').style.display = 'block';
    loginForm.reset(); registerForm.reset();
    showLoginTab();
  });
})();
</script>

</body>
</html>
